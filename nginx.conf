server {
    listen 3007;
    server_name _;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = / {
        return 302 /solid-health-questionnaire/;
    }

    location = /solid-health-questionnaire {
        return 301 /solid-health-questionnaire/;
    }

    location /solid-health-questionnaire/ {
        try_files $uri $uri/ /solid-health-questionnaire/index.html;
    }
}
